<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ bot }} · Simulador de WhatsApp</title>
<style>
  :root { --verde:#075e54; --verde2:#128c7e; --burbuja-usuario:#d9fdd3; --fondo:#efeae2; --texto:#111b21; --gris:#667781; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Segoe UI",system-ui,sans-serif; background:#d1d7db; color:var(--texto); min-height:100vh;
         display:flex; justify-content:center; align-items:flex-start; gap:24px; padding:20px; flex-wrap:wrap; }
  .telefono { width:420px; max-width:100%; height:min(88vh,820px); background:var(--fondo); border-radius:18px; overflow:hidden;
              display:flex; flex-direction:column; box-shadow:0 10px 40px rgba(0,0,0,.25); }
  header { background:var(--verde); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:12px; }
  .avatar { width:42px; height:42px; border-radius:50%; background:#fff; display:grid; place-items:center; font-size:22px; }
  header h1 { font-size:17px; font-weight:600; } header small { opacity:.8; font-size:12px; }
  #chat { flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:6px;
          background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px); background-size:14px 14px; }
  .msg { max-width:82%; padding:7px 10px 5px; border-radius:9px; font-size:14.5px; line-height:1.38; word-wrap:break-word;
         box-shadow:0 1px .5px rgba(0,0,0,.13); }
  .msg .hora { display:block; text-align:right; font-size:10.5px; color:var(--gris); margin-top:2px; }
  .bot { background:#fff; align-self:flex-start; border-top-left-radius:2px; }
  .usuario { background:var(--burbuja-usuario); align-self:flex-end; border-top-right-radius:2px; }
  .aviso { border-left:4px solid #f5a623; }
  .escribiendo { color:var(--gris); font-style:italic; }
  .chips { display:flex; gap:6px; padding:8px 10px 0; overflow-x:auto; background:#f0f2f5; }
  .chips button { white-space:nowrap; border:1px solid #cfd6da; background:#fff; color:var(--verde); border-radius:16px; padding:5px 11px;
                  font-size:12.5px; cursor:pointer; } .chips button:hover { background:#e7f5f2; }
  form { display:flex; gap:8px; padding:8px 10px 10px; background:#f0f2f5; }
  form input { flex:1; border:none; border-radius:20px; padding:11px 15px; font-size:15px; outline:none; }
  form button { width:44px; border:none; border-radius:50%; background:var(--verde2); color:#fff; font-size:18px; cursor:pointer; }
  .panel { width:330px; max-width:100%; background:#fff; border-radius:14px; padding:18px; box-shadow:0 6px 24px rgba(0,0,0,.15); font-size:14px; }
  .panel h2 { font-size:16px; margin-bottom:4px; color:var(--verde); } .panel p { color:var(--gris); margin-bottom:12px; line-height:1.4; }
  .panel label { font-size:12px; color:var(--gris); display:block; margin:10px 0 4px; }
  .panel input { width:100%; padding:8px 10px; border:1px solid #cfd6da; border-radius:8px; font-size:14px; }
  .reloj { font-size:20px; font-weight:600; text-align:center; background:#f0f2f5; border-radius:10px; padding:10px; margin:6px 0; }
  .fila { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
  .panel button.dev { padding:8px; border:1px solid var(--verde2); background:#fff; color:var(--verde2); border-radius:8px; cursor:pointer; font-size:13px; }
  .panel button.dev:hover { background:var(--verde2); color:#fff; }
  .panel button.peligro { margin-top:14px; width:100%; border-color:#d9534f; color:#d9534f; }
  .panel button.peligro:hover { background:#d9534f; color:#fff; }
  .insignia { display:inline-block; background:#fff3cd; color:#7a5b00; padding:2px 8px; border-radius:10px; font-size:11px; margin-bottom:10px; }
  @media (prefers-color-scheme: dark) { body { background:#0b141a; } .panel { background:#202c33; color:#e9edef; }
     .panel input { background:#2a3942; color:#e9edef; border-color:#3b4a54; } .reloj { background:#2a3942; } }
</style>
</head>
<body>
<div class="telefono">
  <header>
    <div class="avatar">🩺</div>
    <div><h1>{{ bot }}</h1><small id="estado">en línea</small></div>
  </header>
  <div id="chat"></div>
  <div class="chips">
    <button data-t="menu">📋 Menú</button>
    <button data-t="mis medicamentos">💊 Mis medicinas</button>
    <button data-t="mis citas">📅 Mis citas</button>
    <button data-t="mi agenda">🗓️ Agenda</button>
    <button data-t="tomé">✅ Tomé</button>
    <button data-t="posponer">⏰ Posponer</button>
    <button data-t="omitir">❌ Omitir</button>
  </div>
  <form id="form"><input id="texto" autocomplete="off" placeholder="Escribe un mensaje"><button>➤</button></form>
</div>

<aside class="panel">
  <span class="insignia">Modo {{ modo }} · simulador de WhatsApp</span>
  <h2>Panel de demostración</h2>
  <p>Aquí puedes probar los recordatorios automáticos sin esperar horas reales: adelanta el reloj y el bot enviará los avisos que correspondan.</p>
  <label>Tu número (cada número es un usuario distinto)</label>
  <input id="telefono" value="+50370000000">
  <label>Hora simulada del sistema</label>
  <div class="reloj" id="reloj">--</div>
  <div class="fila">
    <button class="dev" data-min="10">+10 min</button><button class="dev" data-min="30">+30 min</button>
    <button class="dev" data-min="60">+1 hora</button><button class="dev" data-min="1440">+1 día</button>
  </div>
  <button class="dev peligro" id="borrar">🗑️ Borrar mis datos y reiniciar</button>
</aside>

<script>
const $ = s => document.querySelector(s);
const chat = $('#chat'), inp = $('#texto'), tel = $('#telefono');
tel.value = localStorage.getItem('medibot_tel') || tel.value;

const esc = t => t.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt = t => esc(t).replace(/\*(.+?)\*/g,'<b>$1</b>').replace(/(^|\s)_(.+?)_(?=\s|$|[.,;:!?)])/g,'$1<i>$2</i>').replace(/\n/g,'<br>');
const hora = () => new Date().toLocaleTimeString('es', {hour:'numeric', minute:'2-digit'});

function burbuja(rol, texto, extra='') {
  const d = document.createElement('div');
  d.className = `msg ${rol} ${extra}`;
  d.innerHTML = fmt(texto) + `<span class="hora">${hora()}</span>`;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}
const api = (url, body) => fetch(url, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : undefined).then(r => r.json());

async function enviar(texto, mostrar = true) {
  if (!texto.trim()) return;
  if (mostrar) burbuja('usuario', texto);
  const ind = burbuja('bot', 'escribiendo…', 'escribiendo');
  const r = await api('/api/mensaje', {telefono: tel.value.trim(), texto});
  await new Promise(ok => setTimeout(ok, 350));
  ind.remove(); burbuja('bot', r.respuesta || 'Error al contactar al servidor.');
}

async function cargar() {
  chat.innerHTML = '';
  const h = await api('/api/historial?telefono=' + encodeURIComponent(tel.value.trim()));
  if (!h.length) return enviar('hola', false);
  h.forEach(m => burbuja(m.rol === 'bot' ? 'bot' : 'usuario', m.texto));
}

async function revisarAvisos() {
  const avisos = await api('/api/notificaciones?telefono=' + encodeURIComponent(tel.value.trim()));
  avisos.forEach(a => burbuja('bot', a, 'aviso'));
  const r = await api('/api/dev/hora'); $('#reloj').textContent = r.ahora;
}

$('#form').onsubmit = e => { e.preventDefault(); const t = inp.value; inp.value = ''; enviar(t); };
document.querySelectorAll('.chips button').forEach(b => b.onclick = () => enviar(b.dataset.t));
document.querySelectorAll('[data-min]').forEach(b => b.onclick = async () => {
  b.disabled = true; $('#estado').textContent = 'avanzando el reloj…';
  await api('/api/dev/avanzar', {minutos: +b.dataset.min});
  await revisarAvisos(); $('#estado').textContent = 'en línea'; b.disabled = false;
});
$('#borrar').onclick = async () => {
  if (!confirm('¿Borrar todos los datos de este número y reiniciar el reloj?')) return;
  await api('/api/dev/borrar', {telefono: tel.value.trim()}); cargar(); revisarAvisos();
};
tel.onchange = () => { localStorage.setItem('medibot_tel', tel.value.trim()); cargar(); };

cargar(); revisarAvisos(); setInterval(revisarAvisos, 3000);
</script>
</body>
</html>
